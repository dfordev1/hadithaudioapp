name: Android

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check, test, and assemble
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hadithaudioapp-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@v4
        with:
          name: hadithaudioapp-unsigned-release-aab
          path: app/build/outputs/bundle/release/*.aab
