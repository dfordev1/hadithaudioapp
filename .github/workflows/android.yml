name: Android

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check, test, and assemble
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hadithaudioapp-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@v4
        with:
          name: hadithaudioapp-unsigned-release-aab
          path: app/build/outputs/bundle/release/*.aab

  device-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify screens and navigation on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --no-daemon
            adb pull /sdcard/Pictures/hadith-ui app/build/reading-screens
      - name: Upload device screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hadithaudioapp-device-ui
          path: |
            app/build/reading-screens
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
